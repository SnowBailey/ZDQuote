name: Build Windows Installer

# 在微软免费 Windows runner 上构建 ZDQuote 安装包。
# 触发：手动（Actions 页面 → Run workflow）或推到 main 分支。
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: PyInstaller 打包（生成 dist/ZDQuote）
        run: python build_win.py
        env:
          PYTHONUTF8: 1

      - name: 检查 PyInstaller 产物
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\ZDQuote")) { throw "dist/ZDQuote not found" }
          Get-ChildItem -Recurse -Path "dist\ZDQuote" | Select-Object -First 20

      - name: 用 Inno Setup 编译安装包（installer/ZDQuote_Setup.exe）
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $exe = @(
              "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
              "C:\Program Files\Inno Setup 6\ISCC.exe"
            ) | Where-Object { Test-Path $_ } | Select-Object -First 1
            if (-not $exe) { throw "ISCC not found" }
          } else {
            $exe = $iscc.Source
          }
          Write-Host "Using ISCC: $exe"
          & $exe installer_win.iss
          if (-not (Test-Path "installer\ZDQuote_Setup.exe")) { throw "ZDQuote_Setup.exe was not created" }
          Get-Item "installer\ZDQuote_Setup.exe" | Select-Object Name, Length

      - name: 上传安装包产物
        uses: actions/upload-artifact@v4
        with:
          name: ZDQuote_Setup
          path: installer/ZDQuote_Setup.exe
          if-no-files-found: warn

      - name: （兜底）同时上传可运行文件夹
        uses: actions/upload-artifact@v4
        with:
          name: ZDQuote_portable
          path: dist/ZDQuote
          if-no-files-found: ignore
